name: dictation
description: >-
  Hold a hotkey, speak, and the words are typed into whatever has focus.
  Windows, pure Dart.
version: 0.1.0
publish_to: none
# Deliberately outside the pub workspace. This package only runs on Windows,
# and a workspace has one package_config.json — resolved by whichever platform
# ran `pub get` last. Resolving here separately lets the Windows SDK own its
# own paths while the rest of the workspace stays resolvable from WSL.
environment:
  sdk: ^3.12.0

dependencies:
  args: ^2.5.0
  ffi: ^2.1.0
  speech_pipeline:
    path: ../speech_pipeline
  win32: ^6.0.0

dev_dependencies:
  lints: ^5.0.0
  test: ^1.25.0
