name: voice_clone_poc
description: >-
  Proof of concept — record a voice in the browser, clone it with audio.cpp
  over dart:ffi, play the result back. No Python, no subprocess.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.5.0

dependencies:
  args: ^2.5.0
  ffi: ^2.1.0
  shelf: ^1.4.0
  # Pinned: the Dart bindings look up symbols by name, so the package and the
  # native library must be the same release. A caret here silently resolves
  # newer bindings against older DLLs and fails at symbol lookup.
  sherpa_onnx: 1.13.4
