# Analyse and test on every push.
#
# Inlined rather than calling popupbits/.github: a reusable workflow in a
# private repository is only callable from the same owner, and this repo lives
# under lohanidamodar/ while that one is a popupbits/ org repo.

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: speech_pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # `flutter pub`, not `dart pub`: sherpa_onnx is published as a Flutter
      # plugin, so the workspace will not resolve without the Flutter SDK even
      # though nothing here is a Flutter app.
      - run: flutter pub get
      - run: dart analyze --fatal-infos
      - run: dart test
